apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: koko-ingress
  namespace: koko
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.koko-music.ai
      secretName: koko-tls
  rules:
    - host: api.koko-music.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: koko-api
                port:
                  number: 80
