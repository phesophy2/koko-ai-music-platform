[package]
name = "koko-api"
version = "0.1.0"
edition = "2021"
description = "Koko AI Music Platform API"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
deadpool-redis = "0.14"
lapin = "2"
aws-sdk-s3 = "1"
config = "0.14"
dotenvy = "0.15"
